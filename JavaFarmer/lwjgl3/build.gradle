apply plugin: 'application'

sourceSets.main.resources.srcDirs += [rootProject.file('assets')]

application {
    mainClass = 'com.javafarmer.lwjgl3.Lwjgl3Launcher'
    applicationName = 'JavaFarmer'
    applicationDefaultJvmArgs = ['-Xms256m', '-Xmx1g', '--enable-native-access=ALL-UNNAMED']
}

// Java 25+ needs a recent LWJGL 3 native-access implementation.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion(rootProject.findProperty('lwjgl3Version') ?: '3.4.3')
            details.because('Keep every LWJGL module on the same Java 25-compatible version.')
        }
    }
}

def lwjglVersion = rootProject.findProperty('lwjgl3Version') ?: '3.4.3'
def lwjglModules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb']
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def lwjglNative = osName.contains('win') ? 'natives-windows' :
        osName.contains('mac') ? (osArch.contains('aarch64') || osArch.contains('arm64') ? 'natives-macos-arm64' : 'natives-macos') :
        'natives-linux'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${rootProject.findProperty('gdxVersion')}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${rootProject.findProperty('gdxVersion')}:natives-desktop"

    // Include only the native binaries for the machine doing the build. This keeps
    // the desktop distribution smaller; create each OS/architecture package on its host.
    lwjglModules.each { module ->
        runtimeOnly "org.lwjgl:${module}:${lwjglVersion}:${lwjglNative}"
    }
}

run {
    workingDir = rootProject.file('assets')
    standardInput = System.in
}

jar {
    archiveBaseName = 'java-farmer-desktop'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
